/* ===== Lógica pura (testável) ===== */
function somar(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i].v; return s; }

function parseMoney(s) {

  function render() {
    app.textContent = "";
    var tabs = document.getElementById("tabs"), tin = document.getElementById("tabsin");
    tin.textContent = ""; tin.style.gridTemplateColumns = "repeat(" + TABS.length + ",1fr)";
    aplicarTema();
    if (S.lic.estado !== "ok") {
      tabs.style.display = "none";
      if (S.lic.estado === "checando") { app.appendChild(el("p", { class: "sub", style: "text-align:center;margin-top:40vh", text: "Carregando..." })); return; }
      app.appendChild(viewLicenca());
      return;
    }
    if (!S.dados) { tabs.style.display = "none"; app.appendChild(viewOnboarding()); return; }
    tabs.style.display = "block";
    TABS.forEach(function (t) {
      var fab = t[0] === "lancar";
      var ativo = S.view === t[0] || (t[0] === "painel" && (S.view === "relatorio" || S.view === "salario"));
      tin.appendChild(el("button", { class: (ativo ? "on" : "") + (fab ? " fab" : ""), "aria-label": t[1], onclick: function () { irPara(t[0]); },
        html: ICONES[t[0]] + (fab ? "" : "<span>" + t[1] + "</span>") }));
    });
    if (S.view !== "relatorio") {
      app.appendChild(el("div", { class: "top" }, [el("div", { class: "logo", text: nicho().emoji }),
        el("div", null, [el("h1", { text: S.dados.config.negocio }), el("div", { class: "sub", text: nicho().nome })])]));
    }
    if (semArmazenamento) app.appendChild(el("div", { class: "tip", text: "Este navegador não está guardando os dados. Saia do modo anônimo ou baixe o backup com frequência." }));
    var f = VIEWS[S.view] || viewInicio;
    if ((S.view === "contas" || S.view === "precos" || S.view === "relatorio") && !AV) f = viewInicio;
    if (S.view === "salario" && !PRO) f = viewInicio;
    app.appendChild(f());
  }
  window.__painel = S;
  render();
  licIniciar();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
}
</script>
</body>
</html>
